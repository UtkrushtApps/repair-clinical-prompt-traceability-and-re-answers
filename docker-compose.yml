services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinical_prompts
      POSTGRES_USER: clinical
      POSTGRES_PASSWORD: clinical
    ports:
      - "54329:5432"
    volumes:
      - clinical_prompt_data:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical -d clinical_prompts"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  clinical_prompt_data:
